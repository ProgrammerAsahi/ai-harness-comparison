<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" role="img" aria-label="多代理任务结构"><title>多代理任务结构</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:19px;font-weight:600;fill:#142e39}.label{font-size:15px;fill:#233e48}.small{font-size:13px;fill:#59717a}.edge{fill:none;stroke:#508984;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="100%" height="100%" rx="16" fill="#f3f7f6"/><text class="title" x="24" y="34">多代理：交付仍要经过统一集成与验证</text><rect x="322" y="64" width="290" height="66" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="467.0" y="91.0" text-anchor="middle">主代理</text><text class="label" x="467.0" y="113.0" text-anchor="middle">统一需求与接口</text><rect x="25" y="190" width="290" height="76" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="170.0" y="222.0" text-anchor="middle">A：只读调查依赖</text><text class="label" x="170.0" y="244.0" text-anchor="middle">交回证据与结论</text><path class="edge" d="M467 130 V156 H170 V188"/><path class="edge" d="M170 266 V302 H467 V333"/><rect x="322" y="190" width="290" height="76" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="467.0" y="222.0" text-anchor="middle">B：独立工作树</text><text class="label" x="467.0" y="244.0" text-anchor="middle">实现后端</text><path class="edge" d="M467 130 V156 H467 V188"/><path class="edge" d="M467 266 V302 H467 V333"/><rect x="619" y="190" width="290" height="76" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="764.0" y="222.0" text-anchor="middle">C：按固定接口</text><text class="label" x="764.0" y="244.0" text-anchor="middle">实现前端</text><path class="edge" d="M467 130 V156 H764 V188"/><path class="edge" d="M764 266 V302 H467 V333"/><rect x="322" y="335" width="290" height="66" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="467.0" y="362.0" text-anchor="middle">主代理检查证据</text><text class="label" x="467.0" y="384.0" text-anchor="middle">合并变更</text><rect x="322" y="447" width="290" height="66" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="467.0" y="474.0" text-anchor="middle">统一测试与审查</text><text class="label" x="467.0" y="496.0" text-anchor="middle">形成可交付结果</text><path class="edge" d="M467 401 V445"/><text class="small" x="26" y="550">接口不清或多人争改同一文件时，增加代理可能增加返工。每个分支也会产生调用成本。</text></svg>