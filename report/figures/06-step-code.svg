<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 595" role="img" aria-label="Step Code 架构与边界"><title>Step Code 架构与边界</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:19px;font-weight:600;fill:#142e39}.label{font-size:15px;fill:#233e48}.small{font-size:13px;fill:#59717a}.edge{fill:none;stroke:#508984;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="100%" height="100%" rx="16" fill="#f3f7f6"/><text class="title" x="24" y="34">Step Code：Pi 派生核心与 Step 产品能力</text><rect x="325" y="62" width="300" height="64" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="475.0" y="99.0" text-anchor="middle">终端界面／脚本输入</text><rect x="325" y="174" width="300" height="84" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="475.0" y="210.0" text-anchor="middle">Pi 派生会话与代理循环</text><text class="label" x="475.0" y="232.0" text-anchor="middle">输入、工具反馈、继续与结束</text><path class="edge" d="M475 126 V172"/><rect x="30" y="172" width="250" height="88" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="155.0" y="210.0" text-anchor="middle">Step 模型适配</text><text class="label" x="155.0" y="232.0" text-anchor="middle">动态目录 → 云端模型</text><path class="edge" d="M325 206 H282"/><path class="edge" d="M280 238 H323"/><rect x="670" y="172" width="250" height="88" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="795.0" y="210.0" text-anchor="middle">本地状态</text><text class="label" x="795.0" y="232.0" text-anchor="middle">历史、分支、摘要、目标</text><path class="edge" d="M625 206 H668"/><path class="edge" d="M670 238 H627"/><rect x="325" y="320" width="300" height="76" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="475.0" y="352.0" text-anchor="middle">Step 工具接口</text><text class="label" x="475.0" y="374.0" text-anchor="middle">权限模式与命令检查</text><path class="edge" d="M475 258 V318"/><rect x="30" y="322" width="250" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="155.0" y="352.0" text-anchor="middle">子代理</text><text class="label" x="155.0" y="374.0" text-anchor="middle">独立上下文／可选工作树</text><path class="edge" d="M325 246 H300 V300 H155 V320"/><rect x="30" y="454" width="250" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="155.0" y="484.0" text-anchor="middle">可选 workflow 编排</text><text class="label" x="155.0" y="506.0" text-anchor="middle">依赖可用的原生脚本环境</text><path class="edge" d="M155 454 V396"/><rect x="325" y="454" width="300" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="475.0" y="484.0" text-anchor="middle">本机文件与命令</text><text class="label" x="475.0" y="506.0" text-anchor="middle">MCP／静态发布插件</text><path class="edge" d="M475 396 V452"/><rect x="670" y="340" width="250" height="136" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="795.0" y="391.0" text-anchor="middle">按安装方式核对能力</text><text class="label" x="795.0" y="413.0" text-anchor="middle">审批 ≠ 系统沙箱</text><text class="label" x="795.0" y="435.0" text-anchor="middle">对话分支 ≠ 文件回滚</text><text class="small" x="31" y="569">主线沿用会话核心；产品层加入配置与工作方式。模型输入、工具执行和发布有各自的数据路径。</text></svg>