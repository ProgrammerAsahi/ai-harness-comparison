<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" role="img" aria-label="任务执行循环"><title>任务执行循环</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:19px;font-weight:600;fill:#142e39}.label{font-size:15px;fill:#233e48}.small{font-size:13px;fill:#59717a}.edge{fill:none;stroke:#508984;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="100%" height="100%" rx="16" fill="#f3f7f6"/><text class="title" x="24" y="34">一次任务：模型提出行动，运行时执行并核对</text><rect x="30" y="70" width="190" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="125.0" y="100.0" text-anchor="middle">用户目标</text><text class="label" x="125.0" y="122.0" text-anchor="middle">与验收条件</text><rect x="260" y="70" width="190" height="72" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="355.0" y="100.0" text-anchor="middle">Harness</text><text class="label" x="355.0" y="122.0" text-anchor="middle">组织上下文</text><rect x="490" y="70" width="190" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="585.0" y="100.0" text-anchor="middle">模型</text><text class="label" x="585.0" y="122.0" text-anchor="middle">提出下一步</text><rect x="720" y="70" width="190" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="815.0" y="100.0" text-anchor="middle">权限</text><text class="label" x="815.0" y="122.0" text-anchor="middle">与执行检查</text><rect x="720" y="225" width="190" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="815.0" y="255.0" text-anchor="middle">文件、终端</text><text class="label" x="815.0" y="277.0" text-anchor="middle">浏览器等工具</text><rect x="490" y="225" width="190" height="72" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="585.0" y="255.0" text-anchor="middle">观察结果</text><text class="label" x="585.0" y="277.0" text-anchor="middle">记录状态</text><rect x="260" y="225" width="190" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="355.0" y="255.0" text-anchor="middle">验证结果</text><text class="label" x="355.0" y="277.0" text-anchor="middle">是否达标</text><rect x="30" y="225" width="190" height="72" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="125.0" y="255.0" text-anchor="middle">交付</text><text class="label" x="125.0" y="277.0" text-anchor="middle">可检查的成果</text><path class="edge" d="M220 106 H258"/><path class="edge" d="M450 106 H488"/><path class="edge" d="M680 106 H718"/><path class="edge" d="M815 142 V223"/><path class="edge" d="M720 261 H682"/><path class="edge" d="M490 261 H452"/><path class="edge" d="M260 261 H222"/><path class="edge" d="M585 225 V182 H355 V144"/><text class="small" x="452" y="172" text-anchor="middle">继续工作</text><text class="small" x="30" y="331">文件、历史、规则和检索材料按需进入上下文；交付前还要检验真实结果。</text></svg>