<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 696" role="img" aria-label="代理方案的分层结构"><title>代理方案的分层结构</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:19px;font-weight:600;fill:#142e39}.label{font-size:15px;fill:#233e48}.small{font-size:13px;fill:#59717a}.edge{fill:none;stroke:#508984;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="100%" height="100%" rx="16" fill="#f3f7f6"/><text class="title" x="24" y="34">一套代理方案可以分层选择</text><rect x="35" y="68" width="530" height="76" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="300.0" y="100.0" text-anchor="middle">交互入口</text><text class="label" x="300.0" y="122.0" text-anchor="middle">终端、编辑器、网页、消息渠道</text><path class="edge" d="M300 144 V168"/><rect x="35" y="170" width="530" height="76" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="300.0" y="202.0" text-anchor="middle">组织层</text><text class="label" x="300.0" y="224.0" text-anchor="middle">单代理、子任务、团队、固定流程</text><path class="edge" d="M300 246 V270"/><rect x="35" y="272" width="530" height="76" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="300.0" y="304.0" text-anchor="middle">上下文与状态</text><text class="label" x="300.0" y="326.0" text-anchor="middle">规则、历史、检索、记忆、检查点</text><path class="edge" d="M300 348 V372"/><rect x="35" y="374" width="530" height="76" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="300.0" y="406.0" text-anchor="middle">运行核心</text><text class="label" x="300.0" y="428.0" text-anchor="middle">模型调用、工具执行、纠错、停止</text><path class="edge" d="M300 450 V474"/><rect x="35" y="476" width="530" height="76" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="300.0" y="508.0" text-anchor="middle">执行边界</text><text class="label" x="300.0" y="530.0" text-anchor="middle">权限、沙箱、容器、远程工作机</text><path class="edge" d="M300 552 V576"/><rect x="35" y="578" width="530" height="76" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="300.0" y="610.0" text-anchor="middle">工具与数据</text><text class="label" x="300.0" y="632.0" text-anchor="middle">文件、浏览器、终端、业务应用</text><rect x="615" y="340" width="255" height="110" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="742.5" y="389.0" text-anchor="middle">模型接口</text><text class="label" x="742.5" y="411.0" text-anchor="middle">Provider、协议、型号</text><path class="edge" d="M565 378 H613"/><path class="edge" d="M615 414 H567"/><text class="small" x="625" y="500">界面变化，不一定意味着</text><text class="small" x="625" y="522">代理核心或模型也变化。</text></svg>