<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975 442" role="img" aria-label="数据流向"><title>数据流向</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:19px;font-weight:600;fill:#142e39}.label{font-size:15px;fill:#233e48}.small{font-size:13px;fill:#59717a}.edge{fill:none;stroke:#508984;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="100%" height="100%" rx="16" fill="#f3f7f6"/><text class="title" x="24" y="34">数据路径：本地界面不等于全链路本地</text><rect x="25" y="164" width="235" height="82" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="142.5" y="199.0" text-anchor="middle">本地文件</text><text class="label" x="142.5" y="221.0" text-anchor="middle">或企业资料</text><rect x="336" y="164" width="245" height="82" rx="10" fill="#dceee9" stroke="#85b8aa"/><text class="label" x="458.5" y="199.0" text-anchor="middle">Harness</text><text class="label" x="458.5" y="221.0" text-anchor="middle">实际运行位置</text><path class="edge" d="M260 205 H334"/><rect x="690" y="60" width="255" height="65" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="817.5" y="97.5" text-anchor="middle">模型推理服务</text><path class="edge" d="M581 205 H634 V92 H688"/><rect x="690" y="176" width="255" height="65" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="817.5" y="213.5" text-anchor="middle">工具与连接器</text><path class="edge" d="M581 205 H634 V208 H688"/><rect x="690" y="292" width="255" height="65" rx="10" fill="#fff" stroke="#cadbd8"/><text class="label" x="817.5" y="329.5" text-anchor="middle">日志、会话与记忆</text><path class="edge" d="M581 205 H634 V324 H688"/><text class="small" x="28" y="410">每条路径都可能位于本机、内网或云端。自托管 Harness 只回答了其中一个位置问题。</text></svg>