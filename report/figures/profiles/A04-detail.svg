<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 970" role="img" aria-label="A04 · 主会话与专用 Agent 工具如何分工"><title>A04 · 主会话与专用 Agent 工具如何分工</title><desc>本图为相邻正文所述的架构切面。箭头表示主要信息或控制交接；具体证据和省略范围见正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="970" rx="16" fill="#f3f7f6"/><text x="40" y="38" font-size="20" font-weight="600" fill="#163d34">A04 · 主会话与专用 Agent 工具如何分工</text><text x="40" y="66" font-size="14" fill="#60796f">深入一层 · 模块、交接与状态；配合图下的机制表阅读</text><path class="edge-halo" d="M350 170 L320 170 L320 470 L300 470" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="1-3" d="M350 170 L320 170 L320 470 L300 470" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M300 490 L330 490 L330 340 L350 340" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-2" d="M300 490 L330 490 L330 340 L350 340" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M480 370 L480 440" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-4" d="M480 370 L480 440" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M300 510 L330 510 L330 560 L640 560 L640 510 L660 510" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-5" d="M300 510 L330 510 L330 560 L640 560 L640 510 L660 510" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M480 540 L480 610" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="4-6" d="M480 540 L480 610" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M770 540 L770 640 L610 640" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="5-6" d="M770 540 L770 640 L610 640" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M350 660 L300 660" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="6-7" d="M350 660 L300 660" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M300 680 L330 680 L330 810 L350 810" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="7-8" d="M300 680 L330 680 L330 810 L350 810" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><rect data-node="1" x="350" y="100" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="144.0" font-size="16" text-anchor="middle" fill="#24453c">主任务会话</text><text x="480.0" y="168.0" font-size="16" text-anchor="middle" fill="#24453c">GeminiClient 演进路线</text><rect data-node="2" x="350" y="270" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="480.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">Agent 工具定义</text><text x="480.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">任务、配置与边界</text><rect data-node="3" x="40" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">主会话模型</text><text x="170.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">上下文和执行决策</text><rect data-node="4" x="350" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">专用 Agent 调用</text><text x="480.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">给定任务范围</text><rect data-node="5" x="660" y="440" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="790.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">文件／命令工具</text><text x="790.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">执行环境中的动作</text><rect data-node="6" x="350" y="610" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="654.0" font-size="16" text-anchor="middle" fill="#24453c">子任务结果</text><text x="480.0" y="678.0" font-size="16" text-anchor="middle" fill="#24453c">交回主会话</text><rect data-node="7" x="40" y="610" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="654.0" font-size="16" text-anchor="middle" fill="#24453c">主会话历史</text><text x="170.0" y="678.0" font-size="16" text-anchor="middle" fill="#24453c">保留需要的结论</text><rect data-node="8" x="350" y="780" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="824.0" font-size="16" text-anchor="middle" fill="#24453c">统一审查</text><text x="480.0" y="848.0" font-size="16" text-anchor="middle" fill="#24453c">修改与测试结果</text><text x="40" y="940" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>