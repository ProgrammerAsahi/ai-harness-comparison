<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-label="D01 · 放大一个 Agent 节点：循环与流程的出口"><title>D01 · 放大一个 Agent 节点：循环与流程的出口</title><desc>本图为相邻正文所述的架构切面。箭头表示主要信息或控制交接；具体证据和省略范围见正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="630" rx="16" fill="#f3f7f6"/><text x="40" y="38" font-size="20" font-weight="600" fill="#163d34">D01 · 放大一个 Agent 节点：循环与流程的出口</text><text x="40" y="66" font-size="14" fill="#60796f">深入一层 · 模块、交接与状态；配合图下的机制表阅读</text><path class="edge-halo" d="M300 150 L350 150" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="1-2" d="M300 150 L350 150" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 150 L660 150" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-3" d="M610 150 L660 150" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M790 200 L790 270" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-4" d="M790 200 L790 270" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M790 370 L790 440" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="4-5" d="M790 370 L790 440" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M660 490 L610 490" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="5-6" d="M660 490 L610 490" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M480 440 L480 370" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="6-8" d="M480 440 L480 370" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 300 L640 300 L640 170 L660 170" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="8-3" d="M610 300 L640 300 L640 170 L660 170" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M660 130 L630 130 L630 250 L320 250 L320 470 L300 470" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-7" d="M660 130 L630 130 L630 250 L320 250 L320 470 L300 470" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M350 340 L330 340 L330 490 L300 490" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="8-7" d="M350 340 L330 340 L330 490 L300 490" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><rect data-node="1" x="40" y="100" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="144.0" font-size="16" text-anchor="middle" fill="#24453c">外层流程输入</text><text x="170.0" y="168.0" font-size="16" text-anchor="middle" fill="#24453c">节点变量与任务</text><rect data-node="2" x="350" y="100" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="480.0" y="144.0" font-size="16" text-anchor="middle" fill="#24453c">Agent Runner</text><text x="480.0" y="168.0" font-size="16" text-anchor="middle" fill="#24453c">准备消息和工具</text><rect data-node="3" x="660" y="100" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="144.0" font-size="16" text-anchor="middle" fill="#24453c">模型生成</text><text x="790.0" y="168.0" font-size="16" text-anchor="middle" fill="#24453c">答复或工具调用</text><rect data-node="4" x="660" y="270" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">函数调用解析</text><text x="790.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">识别工具及参数</text><rect data-node="5" x="660" y="440" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="790.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">工具执行</text><text x="790.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">具体环境中的动作</text><rect data-node="6" x="350" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">工具观察回填</text><text x="480.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">供下一轮模型判断</text><rect data-node="7" x="40" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">节点输出</text><text x="170.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">交还外层工作流</text><rect data-node="8" x="350" y="270" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">循环条件与限制</text><text x="480.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">继续、完成或退出</text><text x="40" y="600" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>