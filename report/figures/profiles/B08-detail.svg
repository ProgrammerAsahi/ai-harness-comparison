<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-label="B08 · 代码上下文引擎与执行代理的分离"><title>B08 · 代码上下文引擎与执行代理的分离</title><desc>本图为相邻正文所述的架构切面。箭头表示主要信息或控制交接；具体证据和省略范围见正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="630" rx="16" fill="#f3f7f6"/><text x="40" y="38" font-size="20" font-weight="600" fill="#163d34">B08 · 代码上下文引擎与执行代理的分离</text><text x="40" y="66" font-size="14" fill="#60796f">深入一层 · 模块、交接与状态；配合图下的机制表阅读</text><path class="edge-halo" d="M300 150 L350 150" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="1-2" d="M300 150 L350 150" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 150 L660 150" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-3" d="M610 150 L660 150" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M300 320 L350 320" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="4-5" d="M300 320 L350 320" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M660 170 L630 170 L630 300 L610 300" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-5" d="M660 170 L630 170 L630 300 L610 300" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 320 L660 320" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="5-6" d="M610 320 L660 320" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M660 340 L630 340 L630 470 L610 470" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="6-7" d="M660 340 L630 340 L630 470 L610 470" fill="none" stroke="#508