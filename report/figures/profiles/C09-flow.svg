e 分派</text><rect data-node="6" x="660" y="270" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">API／LLM／抓取</text><text x="790.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">执行具体操作</text><rect data-node="7" x="350" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">保存结果到变量</text><text x="480.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">供后续步骤引用</text><rect data-node="8" x="660" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">后续步骤或结束</text><text x="790.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">检查产物及错误</text><text x="40" y="600" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>