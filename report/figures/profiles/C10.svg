<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="C10 · NanoClaw 架构示意"><title>C10 · NanoClaw 架构示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="600" rx="16" fill="#f3f7f6"/><text x="30" y="35" font-size="19" font-weight="600" fill="#163d34">C10 · NanoClaw</text><rect x="30" y="75" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">聊天渠道</text><text x="162.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">WhatsApp、Telegram、Slack 等</text><rect x="347" y="75" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">宿主进程</text><text x="479.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">路由、投递与定时巡检</text><rect x="664" y="75" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">中央数据库</text><text x="796.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">用户、群组与代理组归属</text><rect x="30" y="270" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">outbound.db</text><text x="162.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">容器写入、宿主读取</text><rect x="347" y="270" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">代理组容器</text><text x="479.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">非 root，只见显式挂载</text><rect x="664" y="270" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">inbound.db</text><text x="796.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">宿主写入、容器读取</text><rect x="30" y="455" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="490" text-anchor="middle" font-size="15" fill="#24453c">凭据网关</text><text x="162.5" y="515" text-anchor="middle" font-size="15" fill="#24453c">出站请求时注入密钥</text><rect x="347" y="455" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="490" text-anchor="middle" font-size="15" fill="#24453c">模型服务</text><text x="479.5" y="515" text-anchor="middle" font-size="15" fill="#24453c">默认 Anthropic Claude</text><rect x="664" y="455" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="490" text-anchor="middle" font-size="15" fill="#24453c">组目录与记忆</text><text x="796.5" y="515" text-anchor="middle" font-size="15" fill="#24453c">CLAUDE.md、记忆与会话目录</text><path d="M295 118 H344" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M612 118 H661" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 161 V215 H796 V267" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M664 313 H615" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M347 313 H298" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M162 270 V215 H400 V164" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M400 356 V405 H162 V452" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M295 498 H344" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M560 356 V405 H796 V452" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="577" font-size="13" fill="#60796f">每个会话一对 SQLite 文件，各只有一个写入方；回复由宿主投递回原渠道，容器内不持有原始密钥。</text></svg>