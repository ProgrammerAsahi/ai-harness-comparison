<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" aria-label="A02 Codex 架构示意"><title>A02 Codex 架构示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="472" rx="16" fill="#f3f7f6"/><text x="30" y="35" font-size="19" font-weight="600" fill="#163d34">A02 · Codex</text><rect x="30" y="75" width="265" height="86" rx="10" fill="#ffffff" stroke="#adc9bf"/><text x="162.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">CLI／桌面／编辑器</text><text x="162.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">用户目标与审查</text><rect x="347" y="75" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">app-server／核心</text><text x="479.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">任务、回合与事件</text><rect x="664" y="75" width="265" height="86" rx="10" fill="#ffffff" stroke="#adc9bf"/><text x="796.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">模型接口</text><text x="796.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">推理及工具请求</text><rect x="30" y="305" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="162.5" y="340" text-anchor="middle" font-size="15" fill="#24453c">历史与变更结果</text><text x="162.5" y="365" text-anchor="middle" font-size="15" fill="#24453c">恢复、总结、审阅</text><rect x="347" y="305" width="265" height="86" rx="10" fill="#ffffff" stroke="#adc9bf"/><text x="479.5" y="340" text-anchor="middle" font-size="15" fill="#24453c">文件／命令／外部工具</text><text x="479.5" y="365" text-anchor="middle" font-size="15" fill="#24453c">在选定环境执行</text><rect x="664" y="305" width="265" height="86" rx="10" fill="#ffffff" stroke="#adc9bf"/><text x="796.5" y="340" text-anc