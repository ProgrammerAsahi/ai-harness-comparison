<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 970" role="img" aria-label="D05 · 主代理、分类工作者与审查门槛"><title>D05 · 主代理、分类工作者与审查门槛</title><desc>本图为相邻正文所述的架构切面。箭头表示主要信息或控制交接；具体证据和省略范围见正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="970" rx="16" fill="#f3f7f6"/><text x="40" y="38" font-size="20" font-weight="600" fill="#163d34">D05 · 主代理、分类工作者与审查门槛</text><text x="40" y="66" font-size="14" fill="#60796f">深入一层 · 模块、交接与状态；配合图下的机制表阅读</text><path class="edge-halo" d="M480 200 L480 270" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="1-2" d="M480 200 L480 270" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M350 340 L320 340 L320 470 L300 470" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-3" d="M350 340 L320 340 L320 470 L300 470" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M480 370 L480 440" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-4" d="M480 370 L480 440" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M660 470 L630 470 L630 340 L610 340" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="5-2" d="M660 470 L630 470 L630 340 L610 340" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M300 510 L330 510 L330 640 L350 640" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-6" d="M300 510 L330 510 L330 640 L350 640" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M480 540 L480 610" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="4-6" d="M480 540 L480 610" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 640 L640 640 L640 320 L610 320" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="6-2" d="M610 640 L640 640 L640 320 L610 320" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M300 640 L320 640 L320 480 L330 480 L330 320 L350 320" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="7-2" d="M300 640 L320 640 L320 480 L330 480 L330 320 L350 320" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 300 L940 300 L940 810 L610 810" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-8" d="M610 300 L940 300 L940 810 L610 810" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><rect data-node="1" x="350" y="100" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="144.0" font-size="16" text-anchor="middle" fill="#24453c">用户目标与工作流选择</text><text x="480.0" y="168.0" font-size="16" text-anchor="middle" fill="#24453c">直接任务／规划／执行</text><rect data-node="2" x="350" y="270" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="480.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">主 Agent</text><text x="480.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">保持目标与协调责任</text><rect data-node="3" x="40" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">category 工作者</text><text x="170.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">按类别选择模型和技能</text><rect data-node="4" x="350" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">命名专用 Agent</text><text x="480.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">调查、咨询或审查</text><rect data-node="5" x="660" y="440" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="790.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">计划与执行材料</text><text x="790.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">草稿、计划、任务状态</text><rect data-node="6" x="350" y="610" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="654.0" font-size="16" text-anchor="middle" fill="#24453c">子结果与审查反馈</text><text x="480.0" y="678.0" font-size="16" text-anchor="middle" fill="#24453c">汇回主任务继续推进</text><rect data-node="7" x="40" y="610" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="654.0" font-size="16" text-anchor="middle" fill="#24453c">记忆侧车 Kibitzer</text><text x="170.0" y="678.0" font-size="16" text-anchor="middle" fill="#24453c">受限只读召回提示</text><rect data-node="8" x="350" y="780" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="824.0" font-size="16" text-anchor="middle" fill="#24453c">交付及最终验收</text><text x="480.0" y="848.0" font-size="16" text-anchor="middle" fill="#24453c">按约定成功条件检查</text><text x="40" y="940" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>