<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="B21 · Superset 架构示意"><title>B21 · Superset 架构示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="600" rx="16" fill="#f3f7f6"/><text x="30" y="35" font-size="19" font-weight="600" fill="#163d34">B21 · Superset</text><rect x="30" y="75" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">Superset 桌面应用</text><text x="162.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">工作区列表、审阅与终端</text><rect x="347" y="75" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">宿主服务（host service）</text><text x="479.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">工作区、终端与 Git 状态</text><rect x="664" y="75" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">远程与手机访问</text><text x="796.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">Pro 档功能</text><rect x="30" y="270" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">生命周期钩子</text><text x="162.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">向桌面报告代理状态</text><rect x="347" y="270" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">每个任务一个工作树</text><text x="479.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">隔离分支，不隔离进程</text><rect x="664" y="270" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">第三方代理 CLI</text><text x="796.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">Claude Code、Codex 等</text><rect x="347" y="455" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="490" text-anchor="middle" font-size="15" fill="#24453c">分支、差异与 PR</text><text x="479.5" y="515" text-anchor="middle" font-size="15" fill="#24453c">在 Superset 内审阅后集成</text><rect x="664" y="455" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="490" text-anchor="middle" font-size="15" fill="#24453c">模型服务</text><text x="796.5" y="515" text-anchor="middle" font-size="15" fill="#24453c">由各代理自行连接</text><path d="M295 118 H344" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M664 118 H615" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M479 161 V267" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M612 313 H661" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M796 356 V452" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M664 340 H635 V420 H162 V359" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M162 270 V164" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M479 356 V452" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="577" font-size="13" fill="#60796f">Superset 包装代理的启动命令并安装钩子，不经手模型流量；工作树只隔离分支，不隔离进程。</text></svg>