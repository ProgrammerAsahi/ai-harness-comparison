xt x="480.0" y="326.0" font-size="16" text-anchor="middle" fill="#24453c">opencode serve --service</text><text x="480.0" y="350.0" font-size="16" text-anchor="middle" fill="#24453c">HTTP 收输入，SSE 推事件</text><rect data-node="3" x="40" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="472.0" font-size="16" text-anchor="middle" fill="#24453c">会话收件箱</text><text x="170.0" y="496.0" font-size="16" text-anchor="middle" fill="#24453c">Session.prompt</text><text x="170.0" y="520.0" font-size="16" text-anchor="middle" fill="#24453c">接纳输入并唤醒执行</text><rect data-node="4" x="660" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="472.0" font-size="16" text-anchor="middle" fill="#24453c">事件总线</text><text x="790.0" y="496.0" font-size="16" text-anchor="middle" fill="#24453c">增量只推给界面</text><text x="790.0" y="520.0" font-size="16" text-anchor="middle" fill="#24453c">完整事件交给投影</text><rect data-node="5" x="40" y="610" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="170.0" y="642.0" font-size="16" text-anchor="middle" fill="#24453c">SessionRunner</text><text x="170.0" y="666.0" font-size="16" text-anchor="middle" fill="#24453c">逐步循环；每步前</text><text x="170.0" y="690.0" font-size="16" text-anchor="middle" fill="#24453c">检查压缩、重装历史</text><rect data-node="6" x="660" y="610" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="642.0" font-size="16" text-anchor="middle" fill="#24453c">SQLite opencode.db</text><text x="790.0" y="666.0" font-size="16" text-anchor="middle" fill="#24453c">会话、消息与收件箱表</text><text x="790.0" y="690.0" font-size="16" text-anchor="middle" fill="#24453c">只写完整事件</text><rect data-node="7" x="40" y="780" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="812.0" font-size="16" text-anchor="middle" fill="#24453c">模型流 steps.attempt</text><text x="170.0" y="836.0" font-size="16" text-anchor="middle" fill="#24453c">文字、推理、工具调用</text><text x="170.0" y="860.0" font-size="16" text-anchor="middle" fill="#24453c">分段到达</text><rect data-node="8" x="660" y="780" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="812.0" font-size="16" text-anchor="middle" fill="#24453c">工具执行与 subagent</text><text x="790.0" y="836.0" font-size="16" text-anchor="middle" fill="#24453c">逐个检查权限</text><text x="790.0" y="860.0" font-size="16" text-anchor="middle" fill="#24453c">子代理另建子会话</text><text x="40" y="940" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>