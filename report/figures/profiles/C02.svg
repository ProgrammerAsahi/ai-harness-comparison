<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="C02 · OpenClaw 架构示意"><title>C02 · OpenClaw 架构示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="600" rx="16" fill="#f3f7f6"/><text x="30" y="35" font-size="19" font-weight="600" fill="#163d34">C02 · OpenClaw</text><rect x="30" y="75" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">手机／桌面／消息渠道</text><text x="162.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">身份、配对与输入</text><rect x="347" y="75" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">Gateway</text><text x="479.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">连接与会话路由</text><rect x="664" y="75" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">会话队列</text><text x="796.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">顺序、取消与运行所有权</text><rect x="347" y="270" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">选定代理运行时</text><text x="479.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">模型与工具循环</text><rect x="30" y="270" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">模型服务</text><text x="162.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">按后端配置</text><rect x="664" y="270" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">工具与工作空间</text><text x="796.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">宿主或显式沙箱</text><rect x="347" y="455" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="490" text-anchor="middle" font-size="15" fill="#24453c">历史与记忆持久化</text><text x="479.5" y="515" text-anchor="middle" font-size="15" fill="#24453c">确认当前运行可写回</text><path d="M295 118 H344" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M612 118 H661" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M796 161 V215 H479 V267" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M347 313 H298" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M612 313 H661" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M479 356 V452" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M347 498 H15 V205 H430 V164" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><text x="30" y="577" font-size="13" fill="#60796f">持续连接、代理执行与状态写入是不同责任；自托管不自动提供工具隔离。</text></svg>