<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="B17 · Avante.nvim 架构示意"><title>B17 · Avante.nvim 架构示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="600" rx="16" fill="#f3f7f6"/><text x="30" y="35" font-size="19" font-weight="600" fill="#163d34">B17 · Avante.nvim</text><rect x="30" y="75" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">Neovim／Avante</text><text x="162.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">用户、文件与会话</text><rect x="347" y="75" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">宿主界面与会话管理</text><text x="479.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">统一展示与输入</text><rect x="30" y="270" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="162.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">Lua 直接模型路线</text><text x="162.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">模型及对应工具能力</text><rect x="347" y="270" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">ACP 外部代理路线</text><text x="479.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">连接完整执行后端</text><rect x="664" y="270" width="265" height="86" rx="10" fill="#fff" stroke="#adc9bf"/><text x="796.5" y="305" text-anchor="middle" font-size="15" fill="#24453c">后端自己的配置</text><text x="796.5" y="330" text-anchor="middle" font-size="15" fill="#24453c">认证、模型与权限</text><rect x="347" y="455" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="4