610" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="654.0" font-size="16" text-anchor="middle" fill="#24453c">Claude／Pi／DSH</text><text x="790.0" y="678.0" font-size="16" text-anchor="middle" fill="#24453c">各自原生运行机制</text><rect data-node="7" x="40" y="780" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="824.0" font-size="16" text-anchor="middle" fill="#24453c">工具和审批</text><text x="170.0" y="848.0" font-size="16" text-anchor="middle" fill="#24453c">由驱动映射实际能力</text><rect data-node="8" x="660" y="780" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="824.0" font-size="16" text-anchor="middle" fill="#24453c">恢复令牌与事件</text><text x="790.0" y="848.0" font-size="16" text-anchor="middle" fill="#24453c">归一化后返回宿主</text><text x="40" y="940" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>