<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-label="A02 · 一次命令：策略判断、审批与操作系统限制"><title>A02 · 一次命令：策略判断、审批与操作系统限制</title><desc>本图为相邻正文所述的架构切面。箭头表示主要信息或控制交接；具体证据和省略范围见正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="630" rx="16" fill="#f3f7f6"/><text x="40" y="38" font-size="20" font-weight="600" fill="#163d34">A02 · 一次命令：策略判断、审批与操作系统限制</text><text x="40" y="66" font-size="14" fill="#60796f">深入一层 · 模块、交接与状态；配合图下的机制表阅读</text><path class="edge-halo" d="M300 150 L350 150" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="1-2" d="M300 150 L350 150" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 150 L660 150" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-3" d="M610 150 L660 150" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M350 170 L320 170 L320 300 L300 300" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-4" d="M350 170 L320 170 L320 300 L300 300" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M660 170 L630 170 L630 250 L330 250 L330 320 L300 320" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-4" d="M660 170 L630 170 L630 250 L330 250 L330 320 L300 320" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M770 200 L770 250 L640 250 L640 300 L610 300" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-5" d="M770 200 L770 250 L640 250 L640 300 L610 300" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M480 200 L480 270" fill="none" s