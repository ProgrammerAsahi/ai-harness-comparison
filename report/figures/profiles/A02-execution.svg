260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="480.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">准备获准执行</text><text x="480.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">命令、目录及权限</text><rect data-node="6" x="660" y="270" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">平台沙箱后端</text><text x="790.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">落实可执行的限制</text><rect data-node="7" x="350" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">进程输出与退出状态</text><text x="480.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">形成工具观察</text><rect data-node="8" x="660" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">会话继续或结束</text><text x="790.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">根据真实结果判断</text><text x="40" y="600" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>