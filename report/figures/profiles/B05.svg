<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" aria-label="B05 JetBrains Junie 架构示意"><title>B05 JetBrains Junie 架构示意</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="472" rx="16" fill="#f3f7f6"/><text x="30" y="35" font-size="19" font-weight="600" fill="#163d34">B05 · JetBrains Junie</text><rect x="30" y="75" width="265" height="86" rx="10" fill="#ffffff" stroke="#adc9bf"/><text x="162.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">JetBrains／CLI 等入口</text><text x="162.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">任务与项目</text><rect x="347" y="75" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="479.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">IDE 语义及项目材料</text><text x="479.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">符号、诊断、运行配置</text><rect x="664" y="75" width="265" height="86" rx="10" fill="#ffffff" stroke="#adc9bf"/><text x="796.5" y="110" text-anchor="middle" font-size="15" fill="#24453c">规划／实施模型配置</text><text x="796.5" y="135" text-anchor="middle" font-size="15" fill="#24453c">按当前产品选择</text><rect x="30" y="305" width="265" height="86" rx="10" fill="#dceee9" stroke="#adc9bf"/><text x="162.5" y="340" text-anchor="middle" font-size="15" fill="#24453c">计划与变更产物</text><text x="162.5" y="365" text-anchor="middle" font-size="15" fill="#24453c">审阅、验证及交付</text><rect x="347" y="305" width="265" height="86" rx="10" fill="#ffffff" stroke="#adc9bf"/><text x="479.5" y="340" text-anchor="middle" font-size="15" fill="#24453c">IDE／终端执行能力</text><text x="479.5" y="365" text-anchor="middle" font-size="15" fill="#24453c">修改、构建与测试</text><rect x="664" y="305" width="265" height="86" rx="10" fill="#ffffff" stroke="#