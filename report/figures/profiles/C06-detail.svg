<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-label="C06 · 文档导入与回答生成的两条流水线"><title>C06 · 文档导入与回答生成的两条流水线</title><desc>本图为相邻正文所述的架构切面。箭头表示主要信息或控制交接；具体证据和省略范围见正文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#508984" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect width="960" height="630" rx="16" fill="#f3f7f6"/><text x="40" y="38" font-size="20" font-weight="600" fill="#163d34">C06 · 文档导入与回答生成的两条流水线</text><text x="40" y="66" font-size="14" fill="#60796f">深入一层 · 模块、交接与状态；配合图下的机制表阅读</text><path class="edge-halo" d="M300 150 L350 150" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="1-2" d="M300 150 L350 150" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 150 L660 150" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="2-3" d="M610 150 L660 150" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M300 320 L350 320" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="4-5" d="M300 320 L350 320" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M660 170 L630 170 L630 300 L610 300" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="3-5" d="M660 170 L630 170 L630 300 L610 300" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 320 L660 320" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="5-6" d="M610 320 L660 320" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M660 340 L630 340 L630 470 L610 470" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="6-7" d="M660 340 L630 340 L630 470 L610 470" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><path class="edge-halo" d="M610 490 L660 490" fill="none" stroke="#f3f7f6" stroke-width="6"/><path data-edge="7-8" d="M610 490 L660 490" fill="none" stroke="#508984" stroke-width="1.7" marker-end="url(#arrow)"/><rect data-node="1" x="40" y="100" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="144.0" font-size="16" text-anchor="middle" fill="#24453c">上传或接入文档</text><text x="170.0" y="168.0" font-size="16" text-anchor="middle" fill="#24453c">原始资料与权限</text><rect data-node="2" x="350" y="100" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="480.0" y="144.0" font-size="16" text-anchor="middle" fill="#24453c">解析、分块与嵌入</text><text x="480.0" y="168.0" font-size="16" text-anchor="middle" fill="#24453c">把资料变成可检索片段</text><rect data-node="3" x="660" y="100" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="144.0" font-size="16" text-anchor="middle" fill="#24453c">知识索引</text><text x="790.0" y="168.0" font-size="16" text-anchor="middle" fill="#24453c">片段与来源关联</text><rect data-node="4" x="40" y="270" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">用户聊天问题</text><text x="170.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">所选知识与模型</text><rect data-node="5" x="350" y="270" width="260" height="100" rx="12" fill="#dceee9" stroke="#adc9bf"/><text x="480.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">检索／过滤／工具</text><text x="480.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">查找相关证据</text><rect data-node="6" x="660" y="270" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="314.0" font-size="16" text-anchor="middle" fill="#24453c">请求中间层</text><text x="790.0" y="338.0" font-size="16" text-anchor="middle" fill="#24453c">整合消息与检索结果</text><rect data-node="7" x="350" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">模型生成</text><text x="480.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">依据带入的材料回答</text><rect data-node="8" x="660" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">回复与引用</text><text x="790.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">用户核对原文</text><text x="40" y="600" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>