ht="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="170.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">当前分支</text><text x="170.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">选中的上下文路径</text><rect data-node="7" x="350" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="480.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">其他历史分支</text><text x="480.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">仍可回看</text><rect data-node="8" x="660" y="440" width="260" height="100" rx="12" fill="#ffffff" stroke="#adc9bf"/><text x="790.0" y="484.0" font-size="16" text-anchor="middle" fill="#24453c">扩展与界面</text><text x="790.0" y="508.0" font-size="16" text-anchor="middle" fill="#24453c">订阅事件、添加能力</text><text x="40" y="600" font-size="14" fill="#60796f">主路径经过裁剪；同色框仅用于突出阅读重点，不代表相同进程或权限。</text></svg>