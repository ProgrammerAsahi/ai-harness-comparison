<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="02-feature-hierarchy-title 02-feature-hierarchy-desc">
<title id="02-feature-hierarchy-title">大维度分预算，小字段给证据</title><desc id="02-feature-hierarchy-desc">示意：九组等权时每组占 1/9；拆字段不会增加整组权重。</desc>
<style>
text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--figure-ink,#203e3a)}
.bg{fill:var(--figure-bg,#f5f9f8)}.box{fill:var(--figure-box,#e5efed);stroke:var(--figure-line,#547870);stroke-width:1.5}
.accent{fill:var(--figure-accent,#145f55)}.accent-text{fill:var(--figure-on-accent,#fff)}
.muted{fill:var(--figure-muted,#536a64)}.line{stroke:var(--figure-line,#547870);stroke-width:2;fill:none}
.warm{fill:var(--figure-warm,#f4e7cf)}.dash{stroke-dasharray:7 6}
</style><rect class="bg" width="1000" height="570" rx="18"/>
<defs><marker id="02-feature-hierarchy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent" d="M0 0 L10 5 L0 10Z"/></marker></defs>
<text x="34" y="48" font-size="27" class="" text-anchor="start" font-weight="700">大维度分预算，小字段给证据</text>
<text x="34" y="82" font-size="17" class="muted" text-anchor="start" font-weight="400">示意：九组等权时每组占 1/9；拆字段不会增加整组权重。</text>
<rect x="335" y="113" width="330" height="81" rx="13" class="box"/>
<text x="353" y="146" font-size="21" class="" text-anchor="start" font-weight="700">架构比较：总预算 100%</text>
<path class="line" d="M500 194 L245 243" marker-end="url(#02-feature-hierarchy-arrow)"/>
<path class="line" d="M500 194 L745 243" marker-end="url(#02-feature-hierarchy-arrow)"/>
<rect x="45" y="253" width="400" height="99" rx="13" class="box"/>
<text x="63" y="286" font-size="21" class="" text-anchor="start" font-weight="700">状态与恢复：1/9</text>
<text x="63" y="318" font-size="17" class="" text-anchor="start" font-weight="400">持久化、恢复控制、状态范围、回退</text>
<rect x="555" y="253" width="400" height="99" rx="13" class="box"/>
<text x="573" y="286" font-size="21" class="" text-anchor="start" font-weight="700">其余八组：合计 8/9</text>
<text x="573" y="318" font-size="17" class="" text-anchor="start" font-weight="400">控制、边界、调用、上下文等</text>
<path class="line" d="M245 352 L88 392" marker-end="url(#02-feature-hierarchy-arrow)"/>
<rect x="45" y="403" width="85" height="73" rx="13" class="box"/>
<text x="63" y="436" font-size="21" class="" text-anchor="start" font-weight="700">F17</text>
<path class="line" d="M245 352 L193 392" marker-end="url(#02-feature-hierarchy-arrow)"/>
<rect x="150" y="403" width="85" height="73" rx="13" class="box"/>
<text x="168" y="436" font-size="21" class="" text-anchor="start" font-weight="700">F18</text>
<path class="line" d="M245 352 L298 392" marker-end="url(#02-feature-hierarchy-arrow)"/>
<rect x="255" y="403" width="85" height="73" rx="13" class="box"/>
<text x="273" y="436" font-size="21" class="" text-anchor="start" font-weight="700">F19</text>
<path class="line" d="M245 352 L403 392" marker-end="url(#02-feature-hierarchy-arrow)"/>
<rect x="360" y="403" width="85" height="73" rx="13" class="box"/>
<text x="378" y="436" font-size="21" class="" text-anchor="start" font-weight="700">F20</text>
<text x="245" y="511" font-size="19" class="" text-anchor="middle" font-weight="400">每项 1/36 → 每项都关联具体证据</text>
<text x="748" y="416" font-size="22" class="" text-anchor="middle" font-weight="700">若一组拆成八项</text>
<text x="748" y="455" font-size="19" class="" text-anchor="middle" font-weight="400">每项可分 1/72，组预算仍为 1/9</text>
</svg>
