<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="06-interaction-title 06-interaction-desc">
<title id="06-interaction-title">搭配优势可以交叉</title><desc id="06-interaction-desc">全部为虚构数据：示意同一个 Harness 对不同模型的优势不相同。</desc>
<style>
text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--figure-ink,#203e3a)}
.bg{fill:var(--figure-bg,#f5f9f8)}.box{fill:var(--figure-box,#e5efed);stroke:var(--figure-line,#547870);stroke-width:1.5}
.accent{fill:var(--figure-accent,#145f55)}.accent-text{fill:var(--figure-on-accent,#fff)}
.muted{fill:var(--figure-muted,#536a64)}.line{stroke:var(--figure-line,#547870);stroke-width:2;fill:none}
.warm{fill:var(--figure-warm,#f4e7cf)}.dash{stroke-dasharray:7 6}
</style><rect class="bg" width="1000" height="560" rx="18"/>
<defs><marker id="06-interaction-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent" d="M0 0 L10 5 L0 10Z"/></marker></defs>
<text x="34" y="48" font-size="27" class="" text-anchor="start" font-weight="700">搭配优势可以交叉</text>
<text x="34" y="82" font-size="17" class="muted" text-anchor="start" font-weight="400">全部为虚构数据：示意同一个 Harness 对不同模型的优势不相同。</text>
<text x="175" y="139" font-size="20" class="" text-anchor="middle" font-weight="700">模型甲</text>
<text x="455" y="139" font-size="20" class="" text-anchor="middle" font-weight="700">模型乙</text>
<path class="line" d="M175 195 L455 345"/>
<path class="line dash" d="M175 295 L455 220"/>
<circle class="accent" cx="175" cy="195" r="6"/>
<text x="175" y="202" font-size="18" class="accent-text" text-anchor="middle" font-weight="700"></text>
<text x="175" y="179" font-size="20" class="" text-anchor="middle" font-weight="400">80%</text>
<circle class="accent" cx="455" cy="345" r="6"/>
<text x="455" y="352" font-size="18" class="accent-text" text-anchor="middle" font-weight="700"></text>
<text x="455" y="329" font-size="20" class="" text-anchor="middle" font-weight="400">50%</text>
<circle class="accent" cx="175" cy="295" r="6"/>
<text x="175" y="302" font-size="18" class="accent-text" text-anchor="middle" font-weight="700"></text>
<text x="175" y="279" font-size="20" class="" text-anchor="middle" font-weight="400">60%</text>
<circle class="accent" cx="455" cy="220" r="6"/>
<text x="455" y="227" font-size="18" class="accent-text" text-anchor="middle" font-weight="700"></text>
<text x="455" y="204" font-size="20" class="" text-anchor="middle" font-weight="400">75%</text>
<text x="308" y="405" font-size="18" class="" text-anchor="middle" font-weight="400">实线：Harness A　虚线：Harness B</text>
<rect x="580" y="145" width="385" height="145" rx="13" class="box"/>
<text x="598" y="178" font-size="21" class="" text-anchor="start" font-weight="700">先有可比的组合矩阵</text>
<text x="598" y="210" font-size="17" class="" text-anchor="start" font-weight="400">同任务、环境与预算规则</text>
<text x="598" y="238" font-size="17" class="" text-anchor="start" font-weight="400">足够交叉与重复运行</text>
<text x="598" y="266" font-size="17" class="" text-anchor="start" font-weight="400">缺测格子保持缺测</text>
<rect x="580" y="324" width="385" height="134" rx="13" class="accent"/>
<text x="598" y="357" font-size="21" class="accent-text" text-anchor="start" font-weight="700">再估计交互与不确定性</text>
<text x="598" y="389" font-size="17" class="accent-text" text-anchor="start" font-weight="400">不能只把两个单独分数相加</text>
<text x="598" y="417" font-size="17" class="accent-text" text-anchor="start" font-weight="400">不能从静态架构推测成功率</text>
<text x="500" y="514" font-size="21" class="" text-anchor="middle" font-weight="700">这是方法示意，不是产品排名或实测趋势。</text>
</svg>
