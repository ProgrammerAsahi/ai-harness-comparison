<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="05-joint-system-title 05-joint-system-desc">
<title id="05-joint-system-title">组合的有效能力，需要整条链路成立</title><desc id="05-joint-system-desc">规格描述可行性；任务轨迹和验收才提供行为与效果证据。</desc>
<style>
text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--figure-ink,#203e3a)}
.bg{fill:var(--figure-bg,#f5f9f8)}.box{fill:var(--figure-box,#e5efed);stroke:var(--figure-line,#547870);stroke-width:1.5}
.accent{fill:var(--figure-accent,#145f55)}.accent-text{fill:var(--figure-on-accent,#fff)}
.muted{fill:var(--figure-muted,#536a64)}.line{stroke:var(--figure-line,#547870);stroke-width:2;fill:none}
.warm{fill:var(--figure-warm,#f4e7cf)}.dash{stroke-dasharray:7 6}
</style><rect class="bg" width="1000" height="600" rx="18"/>
<defs><marker id="05-joint-system-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent" d="M0 0 L10 5 L0 10Z"/></marker></defs>
<text x="34" y="48" font-size="27" class="" text-anchor="start" font-weight="700">组合的有效能力，需要整条链路成立</text>
<text x="34" y="82" font-size="17" class="muted" text-anchor="start" font-weight="400">规格描述可行性；任务轨迹和验收才提供行为与效果证据。</text>
<rect x="35" y="121" width="280" height="126" rx="13" class="box"/>
<text x="53" y="154" font-size="21" class="" text-anchor="start" font-weight="700">H：Harness 配置</text>
<text x="53" y="186" font-size="17" class="" text-anchor="start" font-weight="400">控制、状态与工具</text>
<text x="53" y="214" font-size="17" class="" text-anchor="start" font-weight="400">选定版本和开启机制</text>
<rect x="360" y="121" width="280" height="126" rx="13" class="box"/>
<text x="378" y="154" font-size="21" class="" text-anchor="start" font-weight="700">K：适配层</text>
<text x="378" y="186" font-size="17" class="" text-anchor="start" font-weight="400">协议转换、错误处理</text>
<text x="378" y="214" font-size="17" class="" text-anchor="start" font-weight="400">哪些能力被保留或降级</text>
<rect x="685" y="121" width="280" height="126" rx="13" class="box"/>
<text x="703" y="154" font-size="21" class="" text-anchor="start" font-weight="700">M：模型端点</text>
<text x="703" y="186" font-size="17" class="" text-anchor="start" font-weight="400">型号、渠道与参数</text>
<text x="703" y="214" font-size="17" class="" text-anchor="start" font-weight="400">接口能力与调用限制</text>
<path class="line" d="M315 181 L355 181" marker-end="url(#05-joint-system-arrow)"/>
<path class="line" d="M680 181 L645 181" marker-end="url(#05-joint-system-arrow)"/>
<path class="line" d="M500 248 L500 299" marker-end="url(#05-joint-system-arrow)"/>
<rect x="245" y="310" width="510" height="104" rx="13" class="box"/>
<text x="263" y="343" font-size="21" class="" text-anchor="start" font-weight="700">T：任务、环境、预算与验收</text>
<text x="263" y="375" font-size="17" class="" text-anchor="start" font-weight="400">共同决定这次组合运行的条件</text>
<path class="line" d="M500 414 L500 455" marker-end="url(#05-joint-system-arrow)"/>
<rect x="245" y="466" width="510" height="96" rx="13" class="accent"/>
<text x="263" y="499" font-size="21" class="accent-text" text-anchor="start" font-weight="700">Y：结果与过程</text>
<text x="263" y="531" font-size="17" class="accent-text" text-anchor="start" font-weight="400">产物、成功、费用、耗时、恢复与失败</text>
</svg>
