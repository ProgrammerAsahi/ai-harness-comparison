<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="01-three-questions-title 01-three-questions-desc">
<title id="01-three-questions-title">三种问题，三张地图</title><desc id="01-three-questions-desc">架构接近、适合任务和实际做得好，需要不同输入与验证。</desc>
<style>
text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--figure-ink,#203e3a)}
.bg{fill:var(--figure-bg,#f5f9f8)}.box{fill:var(--figure-box,#e5efed);stroke:var(--figure-line,#547870);stroke-width:1.5}
.accent{fill:var(--figure-accent,#145f55)}.accent-text{fill:var(--figure-on-accent,#fff)}
.muted{fill:var(--figure-muted,#536a64)}.line{stroke:var(--figure-line,#547870);stroke-width:2;fill:none}
.warm{fill:var(--figure-warm,#f4e7cf)}.dash{stroke-dasharray:7 6}
</style><rect class="bg" width="1000" height="540" rx="18"/>
<defs><marker id="01-three-questions-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent" d="M0 0 L10 5 L0 10Z"/></marker></defs>
<text x="34" y="48" font-size="27" class="" text-anchor="start" font-weight="700">三种问题，三张地图</text>
<text x="34" y="82" font-size="17" class="muted" text-anchor="start" font-weight="400">架构接近、适合任务和实际做得好，需要不同输入与验证。</text>
<rect x="35" y="120" width="280" height="128" rx="13" class="box"/>
<text x="53" y="153" font-size="21" class="" text-anchor="start" font-weight="700">结构相似</text>
<text x="53" y="185" font-size="17" class="" text-anchor="start" font-weight="400">组件、控制、状态</text>
<text x="53" y="213" font-size="17" class="" text-anchor="start" font-weight="400">权限、上下文、扩展</text>
<path class="line" d="M175 250 L175 292" marker-end="url(#01-three-questions-arrow)"/>
<rect x="35" y="305" width="280" height="127" rx="13" class="accent"/>
<text x="53" y="338" font-size="21" class="accent-text" text-anchor="start" font-weight="700">得到的结果</text>
<text x="53" y="370" font-size="17" class="accent-text" text-anchor="start" font-weight="400">差异矩阵与近邻</text>
<text x="53" y="398" font-size="17" class="accent-text" text-anchor="start" font-weight="400">解释机制哪里相同</text>
<rect x="360" y="120" width="280" height="128" rx="13" class="box"/>
<text x="378" y="153" font-size="21" class="" text-anchor="start" font-weight="700">场景适合</text>
<text x="378" y="185" font-size="17" class="" text-anchor="start" font-weight="400">任务需求与硬约束</text>
<text x="378" y="213" font-size="17" class="" text-anchor="start" font-weight="400">用户效用与偏好</text>
<path class="line" d="M500 250 L500 292" marker-end="url(#01-three-questions-arrow)"/>
<rect x="360" y="305" width="280" height="127" rx="13" class="accent"/>
<text x="378" y="338" font-size="21" class="accent-text" text-anchor="start" font-weight="700">得到的结果</text>
<text x="378" y="370" font-size="17" class="accent-text" text-anchor="start" font-weight="400">候选集与取舍</text>
<text x="378" y="398" font-size="17" class="accent-text" text-anchor="start" font-weight="400">解释为何值得试用</text>
<rect x="685" y="120" width="280" height="128" rx="13" class="box"/>
<text x="703" y="153" font-size="21" class="" text-anchor="start" font-weight="700">运行表现</text>
<text x="703" y="185" font-size="17" class="" text-anchor="start" font-weight="400">固定环境和任务</text>
<text x="703" y="213" font-size="17" class="" text-anchor="start" font-weight="400">模型、预算与重复运行</text>
<path class="line" d="M825 250 L825 292" marker-end="url(#01-three-questions-arrow)"/>
<rect x="685" y="305" width="280" height="127" rx="13" class="accent"/>
<text x="703" y="338" font-size="21" class="accent-text" text-anchor="start" font-weight="700">得到的结果</text>
<text x="703" y="370" font-size="17" class="accent-text" text-anchor="start" font-weight="400">效果、成本与失败</text>
<text x="703" y="398" font-size="17" class="accent-text" text-anchor="start" font-weight="400">说明在哪些条件下成立</text>
<text x="500" y="489" font-size="22" class="" text-anchor="middle" font-weight="700">关联三张地图，分别保留证据与解释。</text>
</svg>
