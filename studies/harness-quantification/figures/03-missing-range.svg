<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="03-missing-range-title 03-missing-range-desc">
<title id="03-missing-range-title">未知不会消失：它扩大可确定的范围</title><desc id="03-missing-range-desc">虚构例子：四项等权，三项已知；已知部分差异约 0.333。</desc>
<style>
text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--figure-ink,#203e3a)}
.bg{fill:var(--figure-bg,#f5f9f8)}.box{fill:var(--figure-box,#e5efed);stroke:var(--figure-line,#547870);stroke-width:1.5}
.accent{fill:var(--figure-accent,#145f55)}.accent-text{fill:var(--figure-on-accent,#fff)}
.muted{fill:var(--figure-muted,#536a64)}.line{stroke:var(--figure-line,#547870);stroke-width:2;fill:none}
.warm{fill:var(--figure-warm,#f4e7cf)}.dash{stroke-dasharray:7 6}
</style><rect class="bg" width="1000" height="490" rx="18"/>
<defs><marker id="03-missing-range-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent" d="M0 0 L10 5 L0 10Z"/></marker></defs>
<text x="34" y="48" font-size="27" class="" text-anchor="start" font-weight="700">未知不会消失：它扩大可确定的范围</text>
<text x="34" y="82" font-size="17" class="muted" text-anchor="start" font-weight="400">虚构例子：四项等权，三项已知；已知部分差异约 0.333。</text>
<rect x="35" y="117" width="290" height="118" rx="13" class="box"/>
<text x="53" y="150" font-size="21" class="" text-anchor="start" font-weight="700">已知贡献</text>
<text x="53" y="182" font-size="17" class="" text-anchor="start" font-weight="400">0.25 × (0 + 0.5 + 0.5)</text>
<text x="53" y="210" font-size="17" class="" text-anchor="start" font-weight="400">= 0.25</text>
<rect x="355" y="117" width="290" height="118" rx="13" class="box"/>
<text x="373" y="150" font-size="21" class="" text-anchor="start" font-weight="700">未知重量</text>
<text x="373" y="182" font-size="17" class="" text-anchor="start" font-weight="400">1 − 0.75 = 0.25</text>
<text x="373" y="210" font-size="17" class="" text-anchor="start" font-weight="400">可能贡献 0 到 0.25</text>
<rect x="675" y="117" width="290" height="118" rx="13" class="accent"/>
<text x="693" y="150" font-size="21" class="accent-text" text-anchor="start" font-weight="700">完整差异范围</text>
<text x="693" y="182" font-size="17" class="accent-text" text-anchor="start" font-weight="400">最小 0.25，最大 0.50</text>
<text x="693" y="210" font-size="17" class="accent-text" text-anchor="start" font-weight="400">这是逻辑边界，不是置信区间</text>
<path class="line" d="M100 335 L900 335"/>
<path class="line" d="M100 327 L100 343"/>
<text x="100" y="376" font-size="19" class="" text-anchor="middle" font-weight="400">0</text>
<path class="line" d="M300.0 327 L300.0 343"/>
<text x="300.0" y="376" font-size="19" class="" text-anchor="middle" font-weight="400">0.25</text>
<path class="line" d="M500.0 327 L500.0 343"/>
<text x="500.0" y="376" font-size="19" class="" text-anchor="middle" font-weight="400">0.5</text>
<path class="line" d="M700.0 327 L700.0 343"/>
<text x="700.0" y="376" font-size="19" class="" text-anchor="middle" font-weight="400">0.75</text>
<path class="line" d="M900 327 L900 343"/>
<text x="900" y="376" font-size="19" class="" text-anchor="middle" font-weight="400">1</text>
<rect class="warm" x="300" y="306" width="200" height="18" rx="8"/>
<circle class="accent" cx="300" cy="335" r="7"/>
<text x="300" y="342" font-size="18" class="accent-text" text-anchor="middle" font-weight="700"></text>
<circle class="accent" cx="500" cy="335" r="7"/>
<text x="500" y="342" font-size="18" class="accent-text" text-anchor="middle" font-weight="700"></text>
<text x="500" y="432" font-size="22" class="" text-anchor="middle" font-weight="700">覆盖率 75% 与差异值必须一起呈现。</text>
</svg>
