<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="04-axis-limit-title 04-axis-limit-desc">
<title id="04-axis-limit-title">三个等距对象，不能无损压成一条直线</title><desc id="04-axis-limit-desc">示意距离均为 1；一维展示需要说明横轴的具体含义。</desc>
<style>
text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--figure-ink,#203e3a)}
.bg{fill:var(--figure-bg,#f5f9f8)}.box{fill:var(--figure-box,#e5efed);stroke:var(--figure-line,#547870);stroke-width:1.5}
.accent{fill:var(--figure-accent,#145f55)}.accent-text{fill:var(--figure-on-accent,#fff)}
.muted{fill:var(--figure-muted,#536a64)}.line{stroke:var(--figure-line,#547870);stroke-width:2;fill:none}
.warm{fill:var(--figure-warm,#f4e7cf)}.dash{stroke-dasharray:7 6}
</style><rect class="bg" width="1000" height="565" rx="18"/>
<defs><marker id="04-axis-limit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="accent" d="M0 0 L10 5 L0 10Z"/></marker></defs>
<text x="34" y="48" font-size="27" class="" text-anchor="start" font-weight="700">三个等距对象，不能无损压成一条直线</text>
<text x="34" y="82" font-size="17" class="muted" text-anchor="start" font-weight="400">示意距离均为 1；一维展示需要说明横轴的具体含义。</text>
<path class="line" d="M160 155 L65 318"/>
<path class="line" d="M160 155 L255 318"/>
<path class="line" d="M65 318 L255 318"/>
<circle class="accent" cx="160" cy="155" r="21"/>
<text x="160" y="162" font-size="18" class="accent-text" text-anchor="middle" font-weight="700">甲</text>
<circle class="accent" cx="65" cy="318" r="21"/>
<text x="65" y="325" font-size="18" class="accent-text" text-anchor="middle" font-weight="700">乙</text>
<circle class="accent" cx="255" cy="318" r="21"/>
<text x="255" y="325" font-size="18" class="accent-text" text-anchor="middle" font-weight="700">丙</text>
<text x="79" y="231" font-size="19" class="" text-anchor="start" font-weight="400">1</text>
<text x="239" y="231" font-size="19" class="" text-anchor="start" font-weight="400">1</text>
<text x="160" y="352" font-size="19" class="" text-anchor="middle" font-weight="400">1</text>
<text x="160" y="397" font-size="18" class="" text-anchor="middle" font-weight="400">二维可表示等边关系</text>
<path class="line" d="M430 270 L895 270"/>
<circle class="accent" cx="430" cy="270" r="21"/>
<text x="430" y="277" font-size="18" class="accent-text" text-anchor="middle" font-weight="700">甲</text>
<circle class="accent" cx="662" cy="270" r="21"/>
<text x="662" y="277" font-size="18" class="accent-text" text-anchor="middle" font-weight="700">乙</text>
<circle class="accent" cx="895" cy="270" r="21"/>
<text x="895" y="277" font-size="18" class="accent-text" text-anchor="middle" font-weight="700">丙</text>
<text x="546" y="237" font-size="19" class="" text-anchor="middle" font-weight="400">1</text>
<text x="779" y="237" font-size="19" class="" text-anchor="middle" font-weight="400">1</text>
<text x="662" y="329" font-size="23" class="" text-anchor="middle" font-weight="700">两端距离变成 2</text>
<text x="662" y="372" font-size="19" class="" text-anchor="middle" font-weight="400">不可能同时让三对距离都保持为 1</text>
<rect x="35" y="442" width="930" height="87" rx="13" class="box"/>
<text x="53" y="475" font-size="21" class="" text-anchor="start" font-weight="700">可用的一维轴</text>
<text x="53" y="507" font-size="17" class="" text-anchor="start" font-weight="400">场景效用分数 ｜ 到选定参照的距离 ｜ 标明误差的一维近似投影</text>
</svg>
